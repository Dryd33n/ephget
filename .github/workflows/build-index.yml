name: Build index

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push: # so a change to the website goes live without waiting for the next build
    branches: [main]
    paths:
      - "site/**"

permissions:
  contents: write # publish the release
  actions: write # keep the schedule enabled

concurrency:
  group: build-index

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: index
    steps:
      - uses: actions/checkout@v7

      # Bucket clones, the per-manifest results and the download checks. If the cache
      # is ever lost, the next build clones again and parses everything, which takes
      # under a minute, and the download checks start over.
      - uses: actions/cache/restore@v6
        with:
          path: index/.cache
          key: buckets-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: buckets-

      - name: Test
        run: python3 -m unittest

      - name: Build
        run: python3 -I build_index.py --update --check-urls --buckets .cache/scoop --state .cache/state.json --out out

      - uses: actions/cache/save@v6
        with:
          path: index/.cache
          key: buckets-${{ github.run_id }}-${{ github.run_attempt }}

      # The catalog has its own tag, and is never marked latest: releases/latest is
      # for ephget itself, and the client asks for this release by name.
      - name: Publish to the rolling release
        run: |
          if ! gh release view index > /dev/null 2>&1; then
            gh release create index --latest=false --title "App catalog" \
              --notes "Rebuilt daily from Scoop's buckets. Sources and licences are in NOTICE.md."
          fi
          # One at a time with retries: GitHub can answer 500 while replacing an
          # asset, which would leave the index and its hash out of step.
          for file in out/index.json.gz out/index.json.gz.sha256 NOTICE.md; do
            for attempt in 1 2 3 4; do
              gh release upload index "$file" --clobber && break
              if [ "$attempt" = 4 ]; then exit 1; fi
              sleep 15
            done
          done

      - name: Check what clients are served
        run: |
          url=https://github.com/${{ github.repository }}/releases/download/index
          served=$(curl -fsSL "$url/index.json.gz" | sha256sum | cut -d' ' -f1)
          listed=$(curl -fsSL "$url/index.json.gz.sha256" | cut -d' ' -f1)
          built=$(cut -d' ' -f1 out/index.json.gz.sha256)
          echo "built $built, served $served, listed $listed"
          [ "$served" = "$built" ] && [ "$listed" = "$built" ]

      - name: Assemble the website
        run: |
          mkdir out/site
          cp -r ../site/. out/site/
          cp out/site-index.json out/site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: index/out/site

      # GitHub disables scheduled workflows after 60 days without repository
      # activity, which this repo could otherwise reach between client releases.
      - name: Keep the schedule enabled
        run: gh workflow enable build-index.yml

  # Separate, because only this job needs permission to publish the site. Pages serves
  # the catalog from the page's own domain, which a fetch of a release asset can't do.
  deploy-site:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
